name: sma2_frontend
description: Smart Meal Autopilot Flutter frontend
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.6
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  android_alarm_manager_plus: ^5.0.0
  flutter_local_notifications: ^17.2.3
  android_intent_plus: ^5.0.0
  timezone : ^0.9.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_native_splash:
  color: "#F5F7F6"   # match your app background
  image: assets/logo.png
  android: true
  ios: true

  android_12:
    image: assets/logo.png
    icon_background_color: "#F5F7F6"
  
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"